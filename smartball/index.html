<script>
(() => {
  const { Engine, Bodies, Body, Composite, Events } = Matter;
  // 衝突カテゴリ: 壁=全部に当たる / 釘・カップ=ゲームの玉だけ / 受け皿の玉=壁と受け皿の玉だけ(盤面の釘やカップはすり抜けて落ちる)
  const CAT = { WALL:1, FIELD:2, BALL:4, TRAY:8 };
  const F_WALL = { category:CAT.WALL, mask:0xFFFF }, F_FIELD = { category:CAT.FIELD, mask:CAT.BALL }, F_BALL = { category:CAT.BALL, mask:CAT.WALL | CAT.FIELD | CAT.BALL }, F_TRAY = { category:CAT.TRAY, mask:CAT.WALL | CAT.TRAY };
  const RANK_API = 'https://charamarl.com/api/run-score';
  function beacon(event){ if (window.DR_INTERNAL) return; try{ const body = JSON.stringify({ char:'SMARTBALL', event }); if (!(navigator.sendBeacon && navigator.sendBeacon(RANK_API, body))) fetch(RANK_API, { method:'POST', headers:{ 'Content-Type':'text/plain' }, body, keepalive:true }).catch(()=>{}); }catch(e){} }
  const PINS_URL = 'https://charamarl.com/characters/pins.html';

  // ---- ピンズ12種(characters/pins.html の DESIGNS と同じ順・同じ名前) と、玉になったときのクセ ----
  const PINS = [
    { key:'sue',          name:'スー',         artist:'DinoRenny',      trait:'重い玉',     p:{ density:.012, restitution:.15, frictionAir:.004 } },
    { key:'mossun',       name:'モッスン',      artist:'DinoRenny',      trait:'つるつる',   p:{ density:.006, restitution:.45, friction:0, frictionAir:.002 } },
    { key:'putti',        name:'プッチィ',      artist:'DinoRenny',      trait:'ふわっと',   p:{ density:.004, restitution:.4, frictionAir:.02, lift:.45 } },
    { key:'yurucrazy',    name:'ユルクレイジー', artist:'CRAZY',          trait:'よく跳ねる', p:{ density:.006, restitution:.95 } },
    { key:'danna',        name:'だんな',        artist:'赤猫かるま',       trait:'まっすぐ',   p:{ density:.008, restitution:.25, frictionAir:.012 } },
    { key:'inkumo',       name:'インクモ',      artist:"Ink'z Monster",  trait:'大きい',     p:{ density:.006, restitution:.4, r:15 } },
    { key:'mony',         name:'モニィ',        artist:'morry',          trait:'気まぐれ',   p:{ density:.006, restitution:.4, wobble:1 } },
    { key:'kg_kagechiyo', name:'カゲチヨ',      artist:'カゲチヨ',        trait:'速い',       p:{ density:.006, restitution:.5, power:1.3 } },
    { key:'kg_kimi',      name:'キミ',          artist:'カゲチヨ',        trait:'小さい',     p:{ density:.006, restitution:.4, r:9 } },
    { key:'kg_shigure',   name:'シグレ',        artist:'カゲチヨ',        trait:'しっとり',   p:{ density:.008, restitution:.03 } },
    { key:'kg_promu',     name:'プロム',        artist:'カゲチヨ',        trait:'くるくる',   p:{ density:.006, restitution:.4, friction:.6, spin:1 } },
    { key:'kg_muchiko',   name:'ムチコ',        artist:'カゲチヨ',        trait:'ねばる',     p:{ density:.006, restitution:.2, friction:1, frictionAir:.012, power:1.1 } },
  ];
  const byKey = k => PINS.find(p => p.key === k);
  const PRICE_SINGLE = 1800, PRICE_SET = 4400, BALLS = 5;
  const imgs = {};

  // ---- 画面(論理座標 420×740 を実画面に拡縮) ----
  const wrap = document.getElementById('wrap'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const LW = 420, LH = 740; let SC = 1, OX = 0, OY = 0, DPR = 1;
  function resize(){
    const r = wrap.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR);
    SC = Math.min(r.width / LW, r.height / LH); OX = (r.width - LW * SC) / 2; OY = (r.height - LH * SC) / 2;
  }

  // ---- 盤面 ----
  const engine = Engine.create({ positionIterations:8, velocityIterations:6 }); engine.gravity.y = 1.0;
  const world = engine.world;
  const S = { state:'title', char:null, balls:BALLS, ball:null, tray:[], got:[], combo:0, power:0, charging:false, t:0, flash:0, shake:0, lastHit:null, fx:[], captureCool:0, trayBalls:[], payQueue:[], pop:null, score:0, stuckT:0, fever:0, stars:[false,false,false], bumpers:[], mill:null, starBodies:[] };
  const LANE_X = 394, DIV_X = 372, FIELD_R = 369;   // 発射レーンの玉の中心 / レーンと盤面の仕切りの中心 / 盤面の右端。レーンは 375〜412 の37px(玉の直径は最大30)
  const TOP_C = { x:(8 + 412) / 2, y:200 }, TOP_R = 202;   // 上のアーチ
  const TRAY_Y = 662;                                        // 受け皿の上端(ここから下は玉がたまる)
  const PAYOUT = { x:350, y:656 };                           // 払い出し口(下段カップの右・仕切りの左・受け皿のすぐ上)
  const pockets = [];
  function wall(x, y, w, h, a, filt){ const b = Bodies.rectangle(x, y, w, h, { isStatic:true, angle:a || 0, friction:.1, restitution:.3, collisionFilter: filt || F_WALL }); b.plugin = { kind:'wall' }; return b; }
  function buildBoard(){
    const st = [];
    st.push(wall(4, LH/2, 8, LH*2)); st.push(wall(416, LH/2, 8, LH*2));                    // 外壁
    st.push(wall(DIV_X, (LH + 190) / 2, 6, LH - 190));                                  // レーンと盤面の仕切り(y>190)。受け皿の右端でもある
    // 上のアーチ(多角形の静的セグメント)。右のレーンから上を回って左へ
    const n = 26; for (let i = 0; i < n; i++){ const a0 = Math.PI * (i / n), a1 = Math.PI * ((i + 1) / n); const p0 = { x:TOP_C.x + TOP_R * Math.cos(a0), y:TOP_C.y - TOP_R * Math.sin(a0) }, p1 = { x:TOP_C.x + TOP_R * Math.cos(a1), y:TOP_C.y - TOP_R * Math.sin(a1) };
      const mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2, len = Math.hypot(p1.x - p0.x, p1.y - p0.y) + 2, ang = Math.atan2(p1.y - p0.y, p1.x - p0.x); st.push(wall(mx, my, len, 8, ang)); }
    // 釘(段違いの格子)
    const addPeg = (x, y) => { const peg = Bodies.circle(x, y, 5, { isStatic:true, restitution:.6, friction:.05, collisionFilter:F_FIELD }); peg.plugin = { kind:'peg' }; st.push(peg); };
    const near = (x, y) => [[118, 318], [250, 318], [184, 260]].some(([bx, by]) => Math.hypot(x - bx, y - by) < 44);
    for (let row = 0; row < 5; row++){ const y = 236 + row * 42; const off = row % 2 ? 24 : 0; for (let x = 22 + off; x < FIELD_R - 12; x += 48) if (!near(x, y)) addPeg(x, y); }
    // 左右の壁ぎわを玉が素通りしないように、壁のすぐ内側にも釘(アーチから降りてきた玉を盤面の中へ散らす)
    [220, 310, 400].forEach(y => { addPeg(22, y); addPeg(FIELD_R - 14, y); });
    // 穴(カップ)。上段6・下段6を互い違いに。カップ=底と両脇の短い壁＋中央のセンサー
    // 4個×3段。段の間隔を玉より広く空けて、上段をすり抜けた玉が下の段にも落ちるように(2段×6個だと隙間が玉より狭く、上段しか入らなかった)
    const rows = [{ y:462, xs:[45, 131, 217, 303], val:5 }, { y:540, xs:[88, 174, 260, 346], val:5 }, { y:618, xs:[45, 131, 217, 303], val:15 }];
    let i = 0;
    rows.forEach(r => r.xs.forEach(x => { const pin = PINS[i++]; const cw = 32, ch = 40;   // カップは玉(直径24)より少し広いだけ。広いと5発で4つそろいすぎる(40pxで8割そろった)
      st.push(wall(x - cw/2, r.y, 5, ch, 0, F_FIELD)); st.push(wall(x + cw/2, r.y, 5, ch, 0, F_FIELD)); st.push(wall(x, r.y + ch/2, cw, 5, 0, F_FIELD));
      pockets.push({ x, y:r.y, w:cw, h:ch, key:pin.key, val:r.val }); }));
    // 端のカップと壁のすき間(17px)に玉がはまるので、壁から外側のカップへ斜めのガイドを付ける(玉はカップへ転がる)
    rows.forEach(r => { const xl = r.xs[0], xr = r.xs[r.xs.length - 1]; const cw2 = 16;
      if (xl - cw2 - 12 < 30){ st.push(wall((12 + xl - cw2) / 2 + 2, r.y - 34, 30, 5, Math.atan2(16, 24), F_FIELD)); }
      if (FIELD_R - (xr + cw2) < 30){ st.push(wall((FIELD_R + xr + cw2) / 2 - 2, r.y - 34, 30, 5, -Math.atan2(16, 24), F_FIELD)); } });
    // ギミック: バンパー(当たると弾いて+1玉)・風車(回っている)・星(3つ点けるとFEVER=払い出し2倍)

  }
  function star(x, y, r){ ctx.beginPath(); for (let i = 0; i < 10; i++){ const a = -Math.PI/2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  Events.on(engine, 'collisionStart', ev => {
    for (const pr of ev.pairs){ const a = pr.bodyA, c = pr.bodyB; const ball = (a.plugin && a.plugin.kind === 'ball') ? a : (c.plugin && c.plugin.kind === 'ball') ? c : null; if (!ball || ball !== S.ball) continue; const o = ball === a ? c : a; const k = o.plugin && o.plugin.kind;
      if (k === 'bumper'){ const dx = ball.position.x - o.position.x, dy = ball.position.y - o.position.y, d = Math.hypot(dx, dy) || 1; Body.setVelocity(ball, { x:dx / d * 9, y:dy / d * 9 - 2 }); o.plugin.hitT = 12; S.shake = Math.max(S.shake, 5); S.fx.push({ type:'ring', x:o.position.x, y:o.position.y, t:0 }); payout(S.char, 1); S.pop = { text:'+1', x:o.position.x, y:o.position.y - 20, t:0 }; }
      else if (k === 'star'){ const i = o.plugin.i; if (!S.stars[i]){ S.stars[i] = true; S.fx.push({ type:'ring', x:o.position.x, y:o.position.y, t:0 }); toast('★'); if (S.stars.every(Boolean)){ S.fever = 60 * 12; S.stars = [false, false, false]; S.flash = 12; S.shake = 12; toast('FEVER!! 払い出し2倍'); S.fx.push({ type:'burst', x:184, y:200, t:0 }); } } }
      else if (k === 'mill'){ S.fx.push({ type:'ring', x:o.position.x, y:o.position.y, t:0 }); } }
  });
  function frame(){ requestAnimationFrame(frame); if (document.hidden) return; tick(); draw(); }

  // ---- 入力 ----
  const plunger = document.getElementById('plunger');
  const down = e => { e.preventDefault(); if (S.state === 'play' && !S.launched){ S.charging = true; S.power = 0; } };
  const up = e => { e.preventDefault(); if (S.charging){ S.charging = false; launch(); } };
  plunger.addEventListener('pointerdown', down); plunger.addEventListener('pointerup', up); plunger.addEventListener('pointercancel', up); plunger.addEventListener('pointerleave', up);
  window.addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) down(e); });
  window.addEventListener('keyup', e => { if (e.code === 'Space') up(e); });
  document.getElementById('btnNext').addEventListener('click', nextBall);
  document.getElementById('hitBuy').addEventListener('click', () => { drEvent('smb_single_click', { pin:S.got.length ? S.got[S.got.length - 1].key : '' }); beacon('shop'); });
  document.getElementById('lnkPins').addEventListener('click', () => { drEvent('smb_pins_link'); beacon('shop'); });
  window.addEventListener('resize', resize);

  // ---- 結果カード(1080×1350) ----
  let cardBlob = null;
  function makeCard(){
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1350; const g = c.getContext('2d');
    const INK = '#1B1B1F', F = '"M PLUS Rounded 1c", sans-serif';
    g.fillStyle = '#FFD400'; g.fillRect(0, 0, 1080, 1350);
    for (let y = 0; y < 1350; y += 80) for (let x = 0; x < 1080; x += 80){ g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.arc(x, y, 10, 0, 7); g.fill(); }
    const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
    g.fillStyle = INK; rr(56, 56, 968, 1238, 36); g.fill(); g.fillStyle = '#FFF6E5'; rr(40, 40, 968, 1238, 36); g.fill(); g.lineWidth = 8; g.strokeStyle = INK; g.stroke();
    const outlined = (t, x, y, size, fill, align) => { g.font = `900 ${size}px ${F}`; g.textAlign = align || 'center'; g.textBaseline = 'alphabetic'; g.lineJoin = 'round'; g.lineWidth = Math.max(6, size * .16); g.strokeStyle = INK; g.strokeText(t, x, y); g.fillStyle = fill; g.fillText(t, x, y); };
    outlined('CHARAMARL', 540, 150, 56, '#fff'); outlined('ピンズスマートボール', 540, 230, 64, '#FFE000');
    const n = S.tray.length; outlined(n === 4 ? '4つ そろった！' : `ピンズ ${n}つ あつめた`, 540, 330, 52, '#fff');
    // 台紙(2×2)
    g.fillStyle = '#fff'; rr(190, 380, 700, 700, 40); g.fill(); g.lineWidth = 8; g.strokeStyle = INK; g.stroke();
    for (let i = 0; i < 4; i++){ const x = 190 + 75 + (i % 2) * 350 + 100, y = 380 + 75 + Math.floor(i / 2) * 350 + 100; const k = S.tray[i];
      g.beginPath(); g.arc(x, y, 130, 0, 7); g.fillStyle = k ? '#fff' : '#f0ece4'; g.fill(); g.lineWidth = 6; g.strokeStyle = k ? INK : '#ccc'; g.setLineDash(k ? [] : [14, 12]); g.stroke(); g.setLineDash([]);
      if (k && imgs[k]) g.drawImage(imgs[k], x - 120, y - 120, 240, 240);
      if (k){ g.font = `900 30px ${F}`; g.textAlign = 'center'; g.fillStyle = INK; g.fillText(byKey(k).name, x, y + 165); } }
    outlined(n === 4 ? '4個セット ¥4,400（1個 ¥1,100）' : '4つそろえばセットで買える', 540, 1160, 40, '#fff');
    g.font = `900 30px ${F}`; g.textAlign = 'right'; g.lineWidth = 6; g.strokeStyle = INK; g.strokeText('charamarl.com/smartball/  #CHARAMARL', 990, 1240); g.fillStyle = '#fff'; g.fillText('charamarl.com/smartball/  #CHARAMARL', 990, 1240);
    return c;
  }
  async function prepareCard(){ const prev = document.getElementById('cardPrev'); cardBlob = null; prev.style.display = 'none'; try{ if (document.fonts && document.fonts.load) await document.fonts.load('900 40px "M PLUS Rounded 1c"'); }catch(e){} try{ const c = makeCard(); cardBlob = await new Promise(res => c.toBlob(res, 'image/png')); prev.src = URL.createObjectURL(cardBlob); prev.style.display = 'inline-block'; }catch(e){} }
  async function share(){
    const url = 'https://charamarl.com/smartball/'; const names = S.tray.map(k => byKey(k).name).join('・');
    const text = `ピンズスマートボールで ${S.tray.length}つ あつめた（${names}） #CHARAMARL`;
    drEvent('smb_share', { pins:S.tray.length }); beacon('share');
    if (!cardBlob) await prepareCard();
    if (!cardBlob){ window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url), '_blank'); return; }
    const file = new File([cardBlob], `charamarl_smartball_${S.tray.length}.png`, { type:'image/png' });
    if (navigator.canShare && navigator.canShare({ files:[file] })){ try{ await navigator.share({ files:[file], text: text + ' ' + url }); }catch(e){} }
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(cardBlob); a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url), '_blank'); }
  }

  // ---- キャラ選択 ----
  document.getElementById('pickGrid').innerHTML = PINS.map(p => `<button class="pk" type="button" data-key="${p.key}"><img src="/img/pins/${p.key}.png" alt=""><b>${p.name}</b><small>${p.trait}</small></button>`).join('');
  document.querySelectorAll('#pickGrid .pk').forEach(b => b.addEventListener('click', () => start(b.dataset.key)));

  // ---- 読み込み ----
  async function load(){
    await Promise.all(PINS.map(p => new Promise(res => { const im = new Image(); im.onload = () => { imgs[p.key] = im; res(); }; im.onerror = res; im.src = `/img/pins/${p.key}.png`; })));
    resize(); buildBoard(); requestAnimationFrame(frame);
  }
  load();
  window.SMB = { S, start, launch, tick, draw, pockets, get engine(){ return engine; }, setPower(v){ S.power = v; } };
})();
</script>
