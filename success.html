<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ご購入ありがとうございます — CHARAMARL</title>
<style>
  :root { --bg:#111118; --accent:#f5c842; --accent2:#a259ff; --text:#f0f0f0; --muted:#777; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Helvetica Neue',Arial,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .wrap { text-align:center; padding:40px 24px; max-width:480px; }
  .icon { font-size:72px; margin-bottom:24px; }
  h1 { font-size:28px; font-weight:900; margin-bottom:12px; }
  p { color:var(--muted); font-size:15px; line-height:1.7; margin-bottom:32px; }
  .btn {
    display:inline-block; background:var(--accent); color:#111;
    font-weight:900; font-size:14px; padding:14px 36px;
    border-radius:32px; text-decoration:none; letter-spacing:.06em;
  }
  .logo {
    font-size:18px; font-weight:900; letter-spacing:.1em; margin-bottom:40px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
</style>
<script defer src="/_vercel/insights/script.js"></script>
<script src="/js/ga.js"></script>
<script>setTimeout(function(){try{
  var sid=new URLSearchParams(location.search).get('sid')||('nosid_'+Date.now());
  var seen=JSON.parse(localStorage.getItem('cm_purchased')||'[]');
  if(seen.indexOf(sid)>=0)return;
  seen.push(sid);localStorage.setItem('cm_purchased',JSON.stringify(seen.slice(-20)));
  // 決済前に控えた内容(金額・商品・経路)を載せる。
  // value が無いとGA4の収益が0のままで、何がいくら売れたのか一切追えない。
  var pend=null;
  try{ pend=JSON.parse(localStorage.getItem('cm_pending')||'null'); }catch(e){}
  var p={transaction_id:sid,currency:'JPY'};
  if(pend && Date.now()-(pend.ts||0) < 6*3600*1000){
    p.value=pend.value; p.items=pend.items; p.checkout_type=pend.type;
  }
  if(window.cmEvent)cmEvent('purchase',p);
  // Redisにも購入完了を記録（GA4が落ちても件数だけは残る）
  try{
    (pend&&pend.items||[]).forEach(function(i){
      if(!i.character_id)return;
      fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:i.character_id+'_paid',type:'like',op:'add'})});
    });
  }catch(e){}
  try{ localStorage.removeItem('cm_pending'); }catch(e){}
}catch(e){}},600);</script>
</head>
<body>
<div class="wrap">
  <div class="logo">CHARAMARL</div>
  <div class="icon">🎉</div>
  <h1>ご購入ありがとうございます！</h1>
  <p>ご注文を受け付けました。<br>確認メールをお送りしましたのでご確認ください。<br>発送までしばらくお待ちください。</p>
  <a class="btn" href="/index.html">ショップに戻る</a>
</div>
</body>
</html>
