<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>CHARAMARL 管理</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CM管理">
<meta name="theme-color" content="#FF8A00">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#FF8A00; --purple:#A855F7; --black:#1a1a26;
    --line:#e7e7ee; --muted:#8a8a97; --bg:#f7f7fa;
    --tap-min:44px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--black);font-family:'M PLUS Rounded 1c','Helvetica Neue',Arial,sans-serif;padding-bottom:48px;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}

  header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
  .logo{font-size:18px;font-weight:800;letter-spacing:.08em;text-decoration:none;}
  .logo .c1{color:var(--orange);} .logo .c2{color:var(--purple);}
  .back{color:var(--muted);text-decoration:none;font-size:12px;font-weight:700;min-height:var(--tap-min);display:inline-flex;align-items:center;}

  .wrap{max-width:640px;margin:0 auto;padding:14px 16px;}
  /* タブ: 4セクションを1画面ずつ切り替える（縦に積むとスクロールが長すぎるため） */
  .tabbar{position:sticky;top:57px;z-index:9;background:var(--bg);
    padding:10px 16px 8px;margin:0 auto;max-width:640px;
    display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;}
  .tabbar::-webkit-scrollbar{display:none;}
  .tb{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:9px 14px;font-family:inherit;font-size:13px;font-weight:800;color:var(--muted);
    cursor:pointer;min-height:var(--tap-min);display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .tb .n{font-variant-numeric:tabular-nums;font-size:12px;font-weight:800;
    background:var(--line);color:var(--black);border-radius:999px;padding:1px 7px;}
  .tb.on{background:var(--black);color:#fff;border-color:var(--black);}
  .tb.on .n{background:rgba(255,255,255,.22);color:#fff;}
  .tb .n.alert{background:#ffe3e8;color:#e0245e;}
  .tb.on .n.alert{background:#ff5a7a;color:#fff;}
  .pane[hidden]{display:none;}
  .toolbar{display:flex;gap:8px;align-items:center;margin:0 0 14px;flex-wrap:wrap;}
  .toolbar input[type=search]{flex:1;min-width:160px;min-height:var(--tap-min);
    border:1px solid var(--line);border-radius:14px;padding:0 14px;font-family:inherit;font-size:14px;background:#fff;}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;
    color:var(--black);background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:0 14px;min-height:var(--tap-min);cursor:pointer;}
  .fold{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;margin-bottom:12px;}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--orange);text-transform:uppercase;}
  h1{font-size:22px;font-weight:800;margin:2px 0 4px;}
  .sub{font-size:12px;color:var(--muted);margin-bottom:18px;}
  .sub b{color:var(--black);}

  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;position:relative;}
  .card .del{position:absolute;top:10px;right:10px;width:var(--tap-min);height:var(--tap-min);display:flex;align-items:center;justify-content:center;background:none;border:none;border-radius:12px;color:var(--muted);font-size:16px;font-family:inherit;cursor:pointer;}
  .card .del:hover{background:#fff0f2;color:#e0245e;}
  .card .del:focus-visible{outline:3px solid var(--purple);outline-offset:1px;}
  .card .nm{font-size:15px;font-weight:800;padding-right:44px;}
  .card .genre{display:inline-block;font-size:10px;font-weight:800;color:var(--purple);background:#f3e9ff;border-radius:9px;padding:3px 9px;margin-left:8px;vertical-align:middle;}
  .card .ts{font-size:10px;color:var(--muted);margin-top:2px;}
  .card .ln{font-size:12px;margin-top:8px;word-break:break-all;}
  .card .ln a{color:var(--purple);font-weight:700;}
  .card .msg{font-size:12px;line-height:1.8;margin-top:8px;background:var(--bg);border-radius:12px;padding:10px 12px;white-space:pre-wrap;}

  .empty{text-align:center;padding:56px 20px;background:#fff;border:1px dashed var(--line);border-radius:22px;color:var(--muted);font-size:13px;font-weight:700;}
  .gcard{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px;align-items:flex-start;}
  .gcard img{width:92px;height:92px;border-radius:12px;object-fit:cover;background:#eee;flex:0 0 auto;}
  .gcard .gi{min-width:0;flex:1;}
  .gcard .gt{font-size:14px;font-weight:800;}
  .gcard .ga{font-size:11px;color:var(--muted);margin-top:1px;}
  .gcard .gl{font-size:11px;margin-top:4px;word-break:break-all;}
  .gcard .gl a{color:var(--purple);font-weight:700;}
  .gcard .gd{font-size:11px;color:#555;line-height:1.6;margin-top:4px;}
  .gbtns{display:flex;flex-direction:column;gap:8px;flex:0 0 auto;}
  .gbtn{min-height:var(--tap-min);padding:0 16px;border:none;border-radius:14px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;}
  .gbtn.ok{background:#1a7f4b;color:#fff;}
  .gbtn.ng{background:#f3f3f6;color:#555;}
  .gbtn.rm{background:#fff0f2;color:#e0245e;}
  .gbtn:focus-visible{outline:3px solid var(--purple);outline-offset:1px;}
  .badge-live{display:inline-block;font-size:9px;font-weight:800;color:#1a7f4b;background:#e8f8ee;border-radius:8px;padding:2px 8px;margin-left:6px;vertical-align:middle;}
  .editbox{margin-top:8px;background:var(--bg);border-radius:12px;padding:10px;}
  .editbox label{display:block;font-size:10px;font-weight:800;color:var(--muted);margin:6px 0 2px;}
  .editbox input,.editbox textarea{width:100%;padding:8px 10px;font-family:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:8px;background:#fff;}
  .editbox textarea{min-height:52px;resize:vertical;}
  .editbox .gbtn{margin-top:8px;width:100%;}
  .err{background:#FFC7CE;color:#9C0006;border-radius:14px;padding:12px 14px;font-size:12px;font-weight:700;margin-bottom:14px;display:none;}
  .refresh{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:var(--tap-min);margin:20px 0 6px;background:var(--orange);color:#fff;border:none;border-radius:26px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;transition:transform .12s;}
  .refresh:active{transform:scale(.95);}
  .refresh:focus-visible{outline:3px solid var(--purple);outline-offset:2px;}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header>
  <a class="logo" href="./index.html"><span class="c1">CHARA</span><span class="c2">MARL</span></a>
  <a class="back" href="./stats.html">📊 ダッシュボード</a>
</header>

<div class="tabbar" id="tabbar">
  <button class="tb on" data-pane="p-gal" type="button">審査 <span class="n" id="tGal">-</span></button>
  <button class="tb" data-pane="p-apply" type="button">応募 <span class="n" id="tApply">-</span></button>
  <button class="tb" data-pane="p-user" type="button">アカウント <span class="n" id="tUser">-</span></button>
  <button class="tb" data-pane="p-seller" type="button">販売者情報 <span class="n" id="tSeller">-</span></button>
</div>

<div class="wrap">
  <div class="err" id="err"></div>

  <section class="pane" id="p-gal">
    <div class="eyebrow">Gallery</div>
    <h1>ギャラリー投稿の審査</h1>
    <p class="sub">審査待ち <b class="num" id="gpCount">-</b> 件 ・ 公開中 <b class="num" id="gaCount">-</b> 件</p>
    <div id="galPending"></div>
    <button class="fold" id="galToggle" type="button">▸ 公開中の作品を表示する</button>
    <div class="toolbar" id="galTools" hidden>
      <input type="search" id="galQ" placeholder="作品名・作家名でしぼりこむ">
    </div>
    <div id="galApproved" hidden></div>
  </section>

  <section class="pane" id="p-apply" hidden>
    <div class="eyebrow">Apply</div>
    <h1>クリエイター応募一覧</h1>
    <p class="sub">全 <b class="num" id="count">-</b> 件（新しい順）</p>
    <div id="list"></div>
  </section>

  <section class="pane" id="p-user" hidden>
    <div class="eyebrow">Accounts</div>
    <h1>アカウント一覧</h1>
    <p class="sub">全 <b class="num" id="uCount">-</b> 件（新しい順）</p>
    <div class="toolbar">
      <input type="search" id="userQ" placeholder="ニックネームでしぼりこむ">
      <label class="chk"><input type="checkbox" id="userZero"> 作品0のみ</label>
    </div>
    <div id="userList"></div>
  </section>

  <section class="pane" id="p-seller" hidden>
    <div class="eyebrow">Payout</div>
    <h1>販売者情報（お支払い先）</h1>
    <p class="sub">登録 <b class="num" id="sCount">-</b> 件</p>
    <div id="sellerList"></div>
  </section>

  <button class="refresh" id="refresh">↻ 一覧を更新する</button>
</div>

<script>
  const key=new URLSearchParams(location.search).get('key')||'';
  const list=document.getElementById('list'), err=document.getElementById('err');
  const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const fmt=ts=>new Date(ts).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  async function load(){
    err.style.display='none';
    try{
      const r=await fetch('/api/apply?key='+encodeURIComponent(key));
      if(r.status===403)throw new Error('アクセス権がありません。運営アカウントでログインするか（→ login.html）、キー付きURLで開いてください');
      if(!r.ok)throw new Error('読み込みに失敗しました ('+r.status+')');
      const d=await r.json();
      document.getElementById('tApply').textContent=d.count;document.getElementById('count').textContent=d.count;
      if(!d.list.length){list.innerHTML='<div class="empty">まだ応募はありません 🦖</div>';return;}
      list.innerHTML=d.list.map(a=>{
        const url=/^https?:\/\//.test(a.sns)?a.sns:(a.sns?'https://'+a.sns:'');
        return `<div class="card">
          <button class="del" data-ts="${a.ts}" title="この応募を削除">✕</button>
          <div class="nm">${esc(a.name)}${a.genre?`<span class="genre">${esc(a.genre)}</span>`:''}</div>
          <div class="ts">${fmt(a.ts)}</div>
          ${a.sns?`<div class="ln">🔗 <a href="${esc(url)}" target="_blank" rel="noopener nofollow">${esc(a.sns)}</a></div>`:''}
          ${a.email?`<div class="ln">✉️ <a href="mailto:${esc(a.email)}">${esc(a.email)}</a></div>`:''}
          ${a.message?`<div class="msg">${esc(a.message)}</div>`:''}
        </div>`;
      }).join('');
    }catch(ex){
      err.textContent=ex.message;err.style.display='block';
      list.innerHTML='';document.getElementById('count').textContent='-';
    }
  }
  list.addEventListener('click',async e=>{
    const btn=e.target.closest('.del'); if(!btn)return;
    const nm=btn.parentElement.querySelector('.nm').textContent;
    if(!confirm(`「${nm}」の応募を削除しますか？（元に戻せません）`))return;
    btn.disabled=true;
    try{
      const r=await fetch(`/api/apply?key=${encodeURIComponent(key)}&ts=${btn.dataset.ts}`,{method:'DELETE'});
      if(!r.ok)throw new Error('削除に失敗しました ('+r.status+')');
      load();
    }catch(ex){err.textContent=ex.message;err.style.display='block';btn.disabled=false;}
  });
  // ===== ギャラリー投稿の審査 =====
  const gp=document.getElementById('galPending'), ga=document.getElementById('galApproved');
  function gcard(a,btns){
    return `<div class="gcard" data-id="${esc(a.id)}">
      <img src="${esc(a.img)}" alt="">
      <div class="gi">
        <div class="gt">${esc(a.title)}${a.status==='approved'?'<span class="badge-live">公開中</span>':''}</div>
        <div class="ga">by ${esc(a.artist)} ・ ${fmt(a.ts)}${a.aiFree?' ・ ✍️ 生成AI不使用宣言済み':' ・ ⚠️ AI宣言なし(旧投稿)'}</div>
        <div style="margin-top:6px;">📂 <select class="gcat" data-id="${esc(a.id)}" style="min-height:36px;padding:4px 10px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:11px;font-weight:700;">
          ${['ARTWORK','CHARACTER','PRODUCT','MAKING','EVENT','INTERVIEW'].map(c=>`<option value="${c}"${(a.cat||'ARTWORK')===c?' selected':''}>${{ARTWORK:'アート作品',CHARACTER:'キャラクター',PRODUCT:'グッズ・商品',MAKING:'制作風景',EVENT:'イベント',INTERVIEW:'インタビュー'}[c]}</option>`).join('')}
        </select></div>
        ${a.link?`<div class="gl">🔗 <a href="${esc(a.link)}" target="_blank" rel="noopener nofollow">${esc(a.link)}</a></div>`:''}
        ${a.desc?`<div class="gd">${esc(a.desc)}</div>`:''}
        <button class="ebtn" data-edit="${esc(a.id)}" type="button" style="margin-top:8px;">✏️ 編集</button>
        <div class="editbox" id="ed_${esc(a.id)}" hidden>
          <label>タイトル</label><input type="text" id="et_${esc(a.id)}" value="${esc(a.title)}" maxlength="60">
          <label>表示名義</label><input type="text" id="ea_${esc(a.id)}" value="${esc(a.artist)}" maxlength="40">
          <label>リンク</label><input type="text" id="el_${esc(a.id)}" value="${esc(a.link||'')}" maxlength="300">
          <label>説明</label><textarea id="ez_${esc(a.id)}" maxlength="500">${esc(a.desc||'')}</textarea>
          <button class="gbtn ok" data-save="${esc(a.id)}" type="button">💾 保存</button>
        </div>
      </div>
      <div class="gbtns">${btns}</div>
    </div>`;
  }
  async function loadGallery(){
    try{
      const r=await fetch(`/api/gallery?status=all&key=${encodeURIComponent(key)}`);
      if(!r.ok)throw new Error('ギャラリー一覧の取得に失敗 ('+r.status+')');
      const d=await r.json();
      const pend=d.list.filter(a=>a.status==='pending'), appr=d.list.filter(a=>a.status==='approved');
      document.getElementById('gpCount').textContent=pend.length;
      document.getElementById('tGal').textContent=pend.length;
      document.getElementById('gaCount').textContent=appr.length;
      gp.innerHTML=pend.length?pend.map(a=>gcard(a,
        `<button class="gbtn ok" data-act="approve">✓ 承認して公開</button><button class="gbtn ng" data-act="reject">見送り</button>`)).join('')
        :'<div class="empty" style="padding:24px;margin-bottom:12px;">審査待ちはありません 🦖</div>';
      ga.innerHTML=appr.map(a=>gcard(a,
        `<button class="gbtn rm" data-act="remove">✕ 掲載終了</button>`)).join('');
    }catch(ex){err.textContent=ex.message;err.style.display='block';}
  }
  async function galAction(id,act){
    const r=await fetch('/api/gallery',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:act,id,key})});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'操作に失敗しました');}
  }
  document.addEventListener('change',async e=>{
    const sel=e.target.closest('.gcat'); if(!sel)return;
    try{
      const r=await fetch('/api/gallery',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'setcat',id:sel.dataset.id,cat:sel.value,key})});
      if(!r.ok)throw new Error('カテゴリ変更に失敗しました');
      sel.style.background='#e8f8ee';setTimeout(()=>sel.style.background='',800);
    }catch(ex){err.textContent=ex.message;err.style.display='block';}
  });
  document.addEventListener('click',e=>{
    const eb=e.target.closest('[data-edit]'); if(!eb)return;
    const box=document.getElementById('ed_'+eb.dataset.edit); box.hidden=!box.hidden;
  });
  document.addEventListener('click',async e=>{
    const sv=e.target.closest('[data-save]'); if(!sv)return;
    const id=sv.dataset.save; sv.disabled=true; sv.textContent='保存中…';
    try{
      const r=await fetch('/api/gallery',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'update',id,key,
          title:document.getElementById('et_'+id).value,
          artist:document.getElementById('ea_'+id).value,
          link:document.getElementById('el_'+id).value,
          desc:document.getElementById('ez_'+id).value})});
      if(!r.ok)throw new Error('保存に失敗しました');
      sv.textContent='✓ 保存しました'; setTimeout(()=>loadGallery(),700);
    }catch(ex){err.textContent=ex.message;err.style.display='block';sv.disabled=false;sv.textContent='💾 保存';}
  });
  document.addEventListener('click',async e=>{
    const btn=e.target.closest('.gbtn'); if(!btn||btn.dataset.save)return;
    const id=btn.closest('.gcard').dataset.id, act=btn.dataset.act;
    const msg={approve:'この作品を承認してギャラリーに公開しますか？',reject:'この投稿を見送りますか？',remove:'この作品の掲載を終了しますか？（画像も削除されます）'}[act];
    if(!confirm(msg))return;
    btn.disabled=true;
    try{await galAction(id,act);loadGallery();}
    catch(ex){err.textContent=ex.message;err.style.display='block';btn.disabled=false;}
  });

  // ===== 販売者情報 =====
  async function loadSellers(){
    const el=document.getElementById('sellerList');
    try{
      const r=await fetch(`/api/seller?key=${encodeURIComponent(key)}`);
      if(!r.ok)throw new Error('販売者情報の取得に失敗 ('+r.status+')');
      const d=await r.json();
      const list=d.list||[];
      document.getElementById('tSeller').textContent=list.length;
      document.getElementById('sCount').textContent=d.count||0;
      if(!list.length){el.innerHTML='<div class="empty" style="padding:24px;">まだ登録はありません 🦖</div>';return;}
      el.innerHTML=list.map(s=>`<div class="card">
        <div class="nm">${esc(s.userName)}<span class="genre">${s.agree?'✅ 条件同意済み':'⚠️ 未同意'}</span></div>
        <div class="ts">${fmt(s.ts)} 登録</div>
        <div class="msg">名義: ${esc(s.sellerName)}
✉️ ${esc(s.email)}
🏦 ${esc(s.bank)} ${esc(s.branch)} ${esc(s.acctType)} ${esc(s.acctNum)}
カナ: ${esc(s.acctName)}${s.note?`
備考: ${esc(s.note)}`:''}</div>
      </div>`).join('');
    }catch(ex){err.textContent=ex.message;err.style.display='block';}
  }

  // ===== アカウント一覧（作品数つき・代行用の仮アカウントを片づけるため） =====
  async function loadUsers(){
    try{
      const [ur,gr]=await Promise.all([
        fetch(`/api/auth?key=${encodeURIComponent(key)}`),
        fetch(`/api/gallery?status=all&key=${encodeURIComponent(key)}`)
      ]);
      if(!ur.ok)throw new Error('アカウント一覧を取得できませんでした（'+ur.status+'）');
      const {users=[]}=await ur.json();
      const gal=gr.ok?((await gr.json()).list||[]):[];
      const cnt={};
      gal.forEach(a=>{const k=String(a.artist||'').toLowerCase();cnt[k]=(cnt[k]||0)+1;});
      document.getElementById('uCount').textContent=users.length;
      const zeroN=users.filter(x=>!(cnt[String(x.name||'').toLowerCase()]||0)).length;
      const tu=document.getElementById('tUser');
      tu.textContent=zeroN; tu.className='n'+(zeroN?' alert':'');
      document.getElementById('userList').innerHTML=users.map(u=>{
        const n=cnt[String(u.name||'').toLowerCase()]||0;
        return `<div class="card" data-works="${n}" style="display:flex;align-items:center;gap:12px;">
          <div style="flex:1;min-width:0;">
            <b>${esc(u.name)}</b>
            <span class="num" style="margin-left:10px;color:${n?'#0a0':'#c00'};font-weight:800;">作品 ${n}</span>
            <div class="sub" style="margin:2px 0 0;">${u.created?fmt(u.created):'登録日不明'}</div>
          </div>
          <button class="del" data-user="${esc(u.name)}" title="このアカウントを削除">✕</button>
        </div>`;
      }).join('')||'<p class="sub">アカウントがありません</p>';
    }catch(ex){err.textContent=ex.message;err.style.display='block';}
  }
  document.getElementById('userList').addEventListener('click',async e=>{
    const btn=e.target.closest('button[data-user]'); if(!btn)return;
    const name=btn.dataset.user;
    if(!confirm(`アカウント「${name}」を削除します。\n作品の掲載は消えません（掲載を消すときはギャラリー側で操作してください）。\nよろしいですか？`))return;
    btn.disabled=true;
    const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'admindel',name,key})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){alert(d.error||'削除できませんでした');btn.disabled=false;return;}
    loadUsers();
  });

  // ===== タブ切り替え =====
  document.getElementById('tabbar').addEventListener('click',e=>{
    const b=e.target.closest('.tb'); if(!b)return;
    document.querySelectorAll('.tb').forEach(x=>x.classList.toggle('on',x===b));
    document.querySelectorAll('.pane').forEach(x=>x.hidden = x.id!==b.dataset.pane);
    window.scrollTo({top:0});
  });

  // ===== 公開中の作品は折りたたみ＋しぼりこみ（98件を毎回スクロールしないため） =====
  const galToggle=document.getElementById('galToggle');
  galToggle.addEventListener('click',()=>{
    const box=document.getElementById('galApproved'), tools=document.getElementById('galTools');
    const open=box.hidden;
    box.hidden=!open; tools.hidden=!open;
    galToggle.textContent=(open?'▾ 公開中の作品を隠す':'▸ 公開中の作品を表示する');
  });
  document.getElementById('galQ').addEventListener('input',e=>{
    const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll('#galApproved .card').forEach(c=>{
      c.style.display = !q || c.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });

  // ===== アカウントのしぼりこみ =====
  function filterUsers(){
    const q=document.getElementById('userQ').value.trim().toLowerCase();
    const zeroOnly=document.getElementById('userZero').checked;
    document.querySelectorAll('#userList .card').forEach(c=>{
      const okQ = !q || c.textContent.toLowerCase().includes(q);
      const okZ = !zeroOnly || c.dataset.works==='0';
      c.style.display = (okQ&&okZ) ? '' : 'none';
    });
  }
  document.getElementById('userQ').addEventListener('input',filterUsers);
  document.getElementById('userZero').addEventListener('change',filterUsers);

  document.getElementById('refresh').addEventListener('click',()=>{load();loadGallery();loadSellers();loadUsers();});
  load();
  loadGallery();
  loadSellers();
  loadUsers();
</script>
</body>
</html>
