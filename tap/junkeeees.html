<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COLOR TAP — CHARAMARL</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background: var(--bg, #F2EDE2);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
    transition: background .35s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .stage {
    position:relative; width:min(92vw, 62vh, 560px); aspect-ratio:32/45;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
    transform-origin: 50% 78%;
    /* 揺らぎ(boil)＋静止時は少し暗く＝映え */
    filter:brightness(.94);
    -webkit-transform: translateZ(0);          /* iOSの消失バグ回避 */
  }
  .stage img {
    width:100%; height:100%; object-fit:contain;
    filter: hue-rotate(var(--hue,0deg)) saturate(var(--sat,1)) brightness(var(--bri,1));
    transition: filter .3s ease;
  }
  /* タップ前だけ、静かに一度だけゆれる。「ここを触れる」を言葉にしないで伝えるため。
     画像を歪めるフィルターではなく transform で動かすので、作家の線には一切触らない。 */
  .stage.nudge { animation: nudge .55s ease-in-out; }
  @keyframes nudge {
    0%,100% { transform: translateX(0)    rotate(0deg); }
    18%     { transform: translateX(-4px) rotate(-.6deg); }
    44%     { transform: translateX(4px)  rotate(.6deg); }
    70%     { transform: translateX(-2px) rotate(-.25deg); }
    88%     { transform: translateX(1px)  rotate(.1deg); }
  }
  @media (prefers-reduced-motion: reduce){ .stage.nudge{ animation:none; } }
  /* pop は .stage 自身に。filter+transform を同一要素にしてiOSの消失を防ぐ */
  .stage.pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  .stage.flip { animation: cardflip .32s ease; }
  .stage.bang { animation: bang .5s cubic-bezier(.2,1.7,.4,1); }
  @keyframes bang { 0%{transform:scale(.62);opacity:.4;} 60%{transform:scale(1.06);opacity:1;} 100%{transform:scale(1);} }
  @keyframes cardflip { 0%{transform:rotateY(0)} 45%{transform:rotateY(90deg)} 55%{transform:rotateY(90deg)} 100%{transform:rotateY(0)} }
  .gacha-count{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:5;max-width:94vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:clamp(12px,3.4vw,15px);font-weight:900;background:#fff;color:#111;border-radius:22px;padding:8px 18px;letter-spacing:.04em;box-shadow:0 4px 0 rgba(0,0,0,.12);}
  .gacha-count b{color:#FF8A00;font-size:1.2em;}
  @keyframes pop {
    0%   { transform: translateY(0)    scale(1)    rotate(0deg); filter:brightness(1.12); }  /* タップ瞬間=明るく */
    25%  { transform: translateY(-14%) scale(1.12) rotate(-5deg); }                                     /* ぴょん */
    55%  { transform: translateY(2%)   scale(.96)  rotate(4deg); }
    100% { transform: translateY(0)    scale(1)    rotate(0deg); filter:brightness(.94); }   /* 揺らぎ=少し暗く */
  }

  .ui { position:fixed; inset:0; pointer-events:none; }
  .name {
    position:fixed; top:9%; left:0; right:0; text-align:center;
    font-size:clamp(20px,4.5vmin,32px); font-weight:800;
    letter-spacing:.14em; color:#111;
    text-shadow:3px 3px 0 rgba(255,233,74,.9);
    opacity:0; transform:translateY(8px) scale(.9);
  }
  .name.show { animation: flash 1.1s ease forwards; }
  @keyframes flash {
    0%   { opacity:0; transform:translateY(8px) scale(.9); }
    15%  { opacity:1; transform:translateY(0) scale(1.06); }
    25%  { transform:scale(1); }
    80%  { opacity:1; }
    100% { opacity:0; }
  }
  /* BOTTOM_FIX */ .bottom { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; z-index:60; padding:8px 8px 6px; pointer-events:none; }
  .hint {
    display:inline-block; margin-bottom:4px; background:#fff; color:#111; font-weight:900;
    padding:12px 24px; border-radius:30px; font-size:clamp(14px,3.5vmin,18px);
    box-shadow:0 6px 0 rgba(0,0,0,.12); animation:bob 1.4s ease-in-out infinite;
    transition:opacity .4s;
  }
  .hint.hide { opacity:0; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);} }

  .tap-here {
    position:fixed; top:16%; right:8%;
    font-family:'Comic Sans MS','Chalkboard SE',cursive;
    font-weight:900; font-size:clamp(22px,5.5vmin,36px); color:#111;
    line-height:1.1; text-align:center; transform-origin:center;
    animation:tapwiggle 1.6s ease-in-out infinite; transition:opacity .4s;
    filter:drop-shadow(2px 2px 0 rgba(255,233,74,.95));
  }
  .tap-here.hide { opacity:0; }
  @keyframes tapwiggle {
    0%{transform:rotate(-6deg) scale(1);} 25%{transform:rotate(4deg) scale(1.08);}
    50%{transform:rotate(-4deg) scale(1.04);} 75%{transform:rotate(5deg) scale(1.1);}
    100%{transform:rotate(-6deg) scale(1);}
  }
  @media (prefers-reduced-motion: reduce){ .tap-here,.hint{ animation:none; } }

  .buy {
    pointer-events:auto; display:inline-block; margin-top:14px;
    background:#111; color:#fff; font-weight:900; text-decoration:none;
    padding:14px 28px; border-radius:30px; font-size:clamp(14px,3.5vmin,18px);
    box-shadow:0 6px 0 rgba(0,0,0,.25); transition:transform .12s;
  }
  .buy:active { transform:scale(.96); }
  .like {
    pointer-events:auto; display:inline-flex; align-items:center; gap:8px; margin-top:14px;
    background:#fff; border:3px solid #111; color:#e0245e; font-weight:900; font-family:inherit;
    padding:12px 24px; border-radius:30px; font-size:clamp(14px,3.5vmin,18px); cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,.15); transition:transform .12s;
  }
  .like:active { transform:scale(.96); }
  .like.on { background:#e0245e; border-color:#e0245e; color:#fff; }

  .share-btn{
    pointer-events:auto; display:inline-flex; align-items:center; gap:8px; margin-top:14px; margin-left:8px;
    background:#fff; border:3px solid #111; color:#111; font-weight:900; font-family:inherit;
    padding:12px 24px; border-radius:30px; font-size:clamp(14px,3.5vmin,18px); cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,.15); transition:transform .12s;
  }
  .share-btn:active{ transform:scale(.96); }
  .share-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:700;display:none;align-items:flex-end;justify-content:center;}
  .share-overlay.open{display:flex;}
  .share-menu{background:#fff;border-radius:22px 22px 0 0;padding:20px 22px 30px;width:min(480px,100%);font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;}
  @media(min-width:600px){ .share-overlay{align-items:center;} .share-menu{border-radius:22px;} }
  .share-title{font-weight:900;font-size:15px;margin-bottom:14px;text-align:center;color:#111;}
  .share-grid{display:flex;flex-direction:column;gap:6px;}
  .share-opt{display:flex;align-items:center;gap:12px;background:none;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:800;color:#111;padding:10px 8px;border-radius:12px;width:100%;}
  .share-opt:hover{background:#f5f5f5;}
  /* ===== 図鑑（みつけたカードを見返す） ===== */
  .zu-btn{ background:#fff;color:#111;border:none;font-weight:900;font-family:inherit;
    padding:12px 20px;border-radius:30px;font-size:clamp(13px,3.2vmin,17px);cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,.15);transition:transform .12s; }
  .zu-btn:active{ transform:scale(.96); }
  .zu-overlay{position:fixed;inset:0;background:#15151c;z-index:800;display:none;
    flex-direction:column;align-items:center;padding:14px 12px calc(14px + env(safe-area-inset-bottom));}
  .zu-overlay.open{display:flex;}
  .zu-head{display:flex;align-items:center;gap:10px;width:min(560px,100%);margin-bottom:10px;color:#fff;}
  .zu-ttl{font-weight:900;font-size:15px;letter-spacing:.04em;}
  .zu-sub{font-size:12px;opacity:.75;}
  .zu-x{margin-left:auto;background:none;border:none;color:#fff;font-size:26px;line-height:1;cursor:pointer;padding:2px 8px;}
  .zu-done{width:min(560px,100%);text-align:center;margin:2px 0 12px;}
  .zu-done-t{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;font-weight:900;
    font-size:clamp(30px,9vw,46px);letter-spacing:.06em;line-height:1.05;
    background:linear-gradient(90deg,#FFD166,#FF8A00 55%,#FF4D8D);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .zu-done-s{color:#fff;font-weight:800;font-size:clamp(12px,3.4vw,15px);opacity:.9;margin-top:4px;}
  .zu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;width:min(560px,100%);
    overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;}
  @media(min-width:520px){ .zu-grid{grid-template-columns:repeat(6,1fr);} }
  .zu-cell{position:relative;height:0;padding-top:123%;border-radius:9px;overflow:hidden;
    background:#2a2a33;border:none;cursor:default;display:block;}
  .zu-cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .zu-cell .q{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;}
  .zu-cell.got{cursor:pointer;}
  .zu-cell .q{color:#5a5a68;font-weight:900;font-size:18px;}
  .zu-overlay.open ~ .gacha-count, body.zu-open .gacha-count{display:none;}
  .zu-cell .n{position:absolute;left:3px;top:3px;font-size:9px;font-weight:800;color:#fff;
    background:rgba(0,0,0,.5);border-radius:4px;padding:1px 4px;}
  /* ===== 会場スタンプ（NFC 3か所） ===== */
  .spot-toast{position:fixed;left:50%;top:56px;transform:translateX(-50%) translateY(-14px);
    z-index:850;background:#111;color:#fff;font-weight:900;font-size:clamp(12px,3.3vw,15px);
    padding:10px 20px;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.22);
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;}
  .spot-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .zu-cell.fes{outline:2px solid #FF8A00;outline-offset:-2px;}
  .zu-cell .fesx{position:absolute;right:3px;top:3px;font-size:8.5px;font-weight:900;color:#111;
    background:#FF8A00;border-radius:4px;padding:1px 4px;letter-spacing:.02em;z-index:2;}
  .zu-big{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:900;display:none;
    align-items:center;justify-content:center;padding:16px;}
  .zu-big.open{display:flex;}
  .zu-big img{max-width:min(560px,94vw);max-height:88vh;border-radius:12px;}
  .share-ic{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;}
</style>
<script defer src="/_vercel/insights/script.js"></script>
<script src="/js/ga.js"></script>

<style>
/* ===== 遊び終わったあとの行き先（結果画面） ===== */
#nextPanel{position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-top:1px solid rgba(0,0,0,.08);box-shadow:0 -8px 28px rgba(0,0,0,.14);
  padding:14px 16px calc(16px + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform .38s cubic-bezier(.2,.9,.25,1);}
#nextPanel.open{transform:translateY(0);}
#nextPanel .nx-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
#nextPanel .nx-t{font-size:14px;font-weight:800;letter-spacing:.02em;color:#1a1a1a;}
#nextPanel .nx-x{border:0;background:transparent;font-size:20px;line-height:1;color:#999;cursor:pointer;padding:2px 6px;}
#nextPanel .nx-btns{display:flex;flex-direction:column;gap:8px;max-width:520px;margin:0 auto;}
#nextPanel a.nx{display:block;text-align:center;text-decoration:none;font-size:14px;font-weight:700;
  padding:12px 14px;border-radius:11px;background:#1a1a1a;color:#fff;}
#nextPanel a.nx.ghost{background:#fff;color:#1a1a1a;border:1.5px solid #1a1a1a;}
#nextPanel a.nx.plain{background:transparent;color:#666;font-weight:600;font-size:12.5px;padding:4px;}
@media (prefers-reduced-motion: reduce){#nextPanel{transition:none;}}
/* パネルが出ている間は ♥/シェアのバーを持ち上げる（隠さない） */
.ui{transition:transform .38s cubic-bezier(.2,.9,.25,1);}
body.nx-open .ui{transform:translateY(calc(-1 * var(--nx-h, 250px)));}
@media (prefers-reduced-motion: reduce){.ui{transition:none;}}

</style>
</head>
<body>


<div class="stage" id="stage">
  <img id="char" src="" alt="">
</div>
<div class="gacha-count" id="gachaCount"></div>

<div class="ui">
  <div class="name" id="name"></div>
  <div class="tap-here" id="tapHere">TAP<br>HERE</div>
  <div class="bottom">
    <div class="hint" id="hint">タップでカードをひこう!</div><br>
    <button class="like" id="likeBtn" type="button" aria-pressed="false"><span id="likeIc">♡</span>いいね <b id="likeCt"></b></button>
    <button class="zu-btn" id="zuBtn" type="button">📖 <span id="zuBtnN">図鑑</span></button>
    <button class="share-btn" id="shareBtn" type="button">🚀 シェア</button>
    <a class="buy" id="buy" href="#" target="_blank" rel="noopener">🛒 購入する</a>
  </div>
</div>


<div class="share-overlay" id="shareOverlay">
  <div class="share-menu">
    <div class="share-title">シェアする</div>
    <div class="share-grid">
      <button class="share-opt" data-sh="x"><span class="share-ic" style="background:#111;color:#fff">𝕏</span>X</button>
      <button class="share-opt" data-sh="line"><span class="share-ic" style="background:#06C755;color:#fff">LINE</span>LINE</button>
      <button class="share-opt" data-sh="copy"><span class="share-ic" style="background:#f0f0f0">🔗</span><span id="shCopyLb">リンクをコピー</span></button>
      <button class="share-opt" data-sh="native" id="shNative"><span class="share-ic" style="background:#f0f0f0">📲</span>その他</button>
    </div>
  </div>
</div>


<div class="zu-overlay" id="zuOverlay">
  <div class="zu-head"><span class="zu-ttl" id="zuTtl">みつけたJUNKeeeeS</span><span class="zu-sub" id="zuSub"></span>
    <button class="zu-x" id="zuClose" aria-label="閉じる">×</button></div>
  <div class="zu-done" id="zuDone" hidden>
    <div class="zu-done-t">COMPLETE!</div>
    <div class="zu-done-s">36人ぜんぶ集まりました。THANK YOU!</div>
  </div>
  <div class="zu-grid" id="zuGrid"></div>
</div>
<div class="spot-toast" id="spotToast"></div>
<div class="zu-big" id="zuBig"><img id="zuBigImg" src="" alt=""></div>

<div id="nextPanel" aria-hidden="true">
  <div class="nx-hd"><span class="nx-t" id="nxTitle">気に入った？</span>
    <button class="nx-x" id="nxClose" aria-label="閉じる">×</button></div>
  <div class="nx-btns" id="nxBtns"></div>
</div>

<script>
/* =========================================================
   COLOR TAP 統一フォーマット — ここだけ書き換えれば新キャラ完成
   ========================================================= */
const CONFIG = {
  character: "JUNKeeeeS",                     // 表示名
  // シェア文は「何枚みつけたか」を入れて組み立てる（下の shareTextNow）
  shareText: "",
  baseImage: "art/junkeeees.jpg",                 // 透過キーアートPNG（正方形・1080px推奨）
  bg: "#EAF1F6",                            // 初期背景色
  mode: "char",                             // "char"=キャラの色が変わる / "bg"=背景の色が変わる（黒系キャラ向け）
  baseHueOffset: -220,                      // 青い体毛を基準に補正

  // mode:"image" のとき使う。事前生成PNG = `${imageDir}/${imageKey}_${key}.png`
  imageDir: "art/colors",
  imageKey: "sue",

  // 6色パレット（key=画像/色名キー。hue/sat/bri は char モード用）
  palettes: [
    { key:"j01", name:"", img:"art/junk/j01.jpg" },
    { key:"j02", name:"", img:"art/junk/j02.jpg" },
    { key:"j03", name:"", img:"art/junk/j03.jpg" },
    { key:"j04", name:"", img:"art/junk/j04.jpg" },
    { key:"j05", name:"", img:"art/junk/j05.jpg" },
    { key:"j06", name:"", img:"art/junk/j06.jpg" },
    { key:"j07", name:"", img:"art/junk/j07.jpg" },
    { key:"j08", name:"", img:"art/junk/j08.jpg" },
    { key:"j09", name:"", img:"art/junk/j09.jpg" },
    { key:"j10", name:"", img:"art/junk/j10.jpg" },
    { key:"j11", name:"", img:"art/junk/j11.jpg" },
    { key:"j12", name:"", img:"art/junk/j12.jpg" },
    { key:"j13", name:"", img:"art/junk/j13.jpg" },
    { key:"j14", name:"", img:"art/junk/j14.jpg" },
    { key:"j15", name:"", img:"art/junk/j15.jpg" },
    { key:"j16", name:"", img:"art/junk/j16.jpg" },
    { key:"j17", name:"", img:"art/junk/j17.jpg" },
    { key:"j18", name:"", img:"art/junk/j18.jpg" },
    { key:"j19", name:"", img:"art/junk/j19.jpg" },
    { key:"j20", name:"", img:"art/junk/j20.jpg" },
    { key:"j21", name:"", img:"art/junk/j21.jpg" },
    { key:"j22", name:"", img:"art/junk/j22.jpg" },
    { key:"j23", name:"", img:"art/junk/j23.jpg" },
    { key:"j24", name:"", img:"art/junk/j24.jpg" },
    { key:"j25", name:"", img:"art/junk/j25.jpg" },
    { key:"j26", name:"", img:"art/junk/j26.jpg" },
    { key:"j27", name:"", img:"art/junk/j27.jpg" },
    { key:"j28", name:"", img:"art/junk/j28.jpg" },
    { key:"j29", name:"", img:"art/junk/j29.jpg" },
    { key:"j30", name:"", img:"art/junk/j30.jpg" },
    { key:"j31", name:"", img:"art/junk/j31.jpg" },
    { key:"j32", name:"", img:"art/junk/j32.jpg" },
    { key:"j33", name:"", img:"art/junk/j33.jpg" },
    { key:"j34", name:"", img:"art/junk/j34.jpg" },
    { key:"j35", name:"", img:"art/junk/j35.jpg" },
    { key:"j36", name:"", img:"art/junk/j36.jpg" },
    { key:"fes1", name:"JUNKeeeeS FES 2026 in KYOTO 🎪", img:"art/junkeeees_fes1.jpg" },
    { key:"fes2", name:"EVENT DETAILS 📅 10/24-25", img:"art/junkeeees_fes2.jpg" },
  ],

  // 購入リンク（Shopify or CHARAMARL）。variants 空なら productUrl のみ
  shop: {
    productUrl: "https://thedinorenny.online/products/...",
    variants: {                              // 色名: Shopify variant ID
      "BLAZE RED":"", "SUNNY YELLOW":"", "SLIME GREEN":"",
      "ICE CYAN":"", "GALAXY BLUE":"", "NEON PINK":"",
    }
  }
};
/* ========================================================= */

document.title = CONFIG.character + " COLOR TAP | CHARAMARL";
document.body.style.setProperty("--bg", CONFIG.bg);
document.getElementById("char").src = CONFIG.baseImage;
// 商品未設定なら購入ボタンを隠す
const shopReady = CONFIG.shop.productUrl && !CONFIG.shop.productUrl.includes("...");
// image方式は全色を事前読み込みしてタップ即時切替（遅延防止）
CONFIG.palettes.filter(p=>p.img).forEach(p => { const im = new Image(); im.src = p.img; });
if(CONFIG.mode === "image"){
  CONFIG.palettes.forEach(p => { const im = new Image(); im.src = `${CONFIG.imageDir}/${CONFIG.imageKey}_${p.key}.png`; });
}

const stage = document.getElementById("stage");
const img   = document.getElementById("char");
const nameEl= document.getElementById("name");
const hint  = document.getElementById("hint");
const tapHere = document.getElementById("tapHere");
const buyEl = document.getElementById("buy");

let idx = 0, tapped = false;

function apply(p){
  if(p.img){
    // FESフライヤー面: フィルタを外して画像そのものを表示
    img.style.filter = "none";
    img.src = p.img;
  } else if(CONFIG.mode === "image"){
    // 事前生成の鮮やかPNGを差し替え（最も正確）
    img.style.filter = "none";
    img.src = `${CONFIG.imageDir}/${CONFIG.imageKey}_${p.key}.png`;
  } else if(CONFIG.mode === "bg"){
    // 背景の色が変わる（黒系キャラ向け）
    document.body.style.background = `hsl(${p.hue}, 85%, 62%)`;
  } else {
    // キャラ（帽子・靴などの有彩色）の色が変わる
    img.style.filter = "";
    img.src = CONFIG.baseImage;
    img.style.setProperty("--hue", (p.hue + CONFIG.baseHueOffset) + "deg");
    img.style.setProperty("--sat", p.sat);
    img.style.setProperty("--bri", p.bri);
  }
  nameEl.textContent = p.name;
  if(window.cmTapSeen)cmTapSeen(p.key);   // 全色を見たら結果画面を出す
  nameEl.classList.remove("show"); void nameEl.offsetWidth; nameEl.classList.add("show"); // ぱっと出てフェイドアウト
  if(shopReady){
    const vid = CONFIG.shop.variants[p.name];
    buyEl.href = vid ? CONFIG.shop.productUrl + "?variant=" + vid : CONFIG.shop.productUrl;
    buyEl.textContent = "🛒 " + p.name + " を購入";
  } else {
    buyEl.style.display = "none";
  }
}
// ===== JUNKeeeeS 36ガチャ + 図鑑 =====
const CARDS = CONFIG.palettes.filter(p=>p.key.startsWith("j"));
const FES = CONFIG.palettes.filter(p=>p.key.startsWith("fes"));
const SEEN_KEY = "junk_gacha_seen";
const seenSet = ()=>{try{return new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||"[]"));}catch(e){return new Set();}};
let deck = [], fesIdx = 0, completeMode = false, curCardKey = null;
function shuffle(){ deck = CARDS.map((c,i)=>i); for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];} }
shuffle();
// FES本番までの残り日数。当日と会期中は文言を変える。
const FES_START = new Date("2026-10-24T00:00:00+09:00");
const FES_END   = new Date("2026-10-25T23:59:59+09:00");
function fesLine(){
  const now = new Date();
  if(now > FES_END) return "";
  if(now >= FES_START) return " ・ FES開催中🍟";
  const d = Math.ceil((FES_START - now) / 86400000);
  return d <= 0 ? " ・ FESは今日🍟" : " ・ FESまであと" + d + "日";
}
function spotLine(){
  try{ const k=spotSet(); if(!k.size) return "";
       return k.size>=3 ? " ・ 会場スタンプ✅" : " ・ 会場スタンプ"+k.size+"/3"; }catch(e){ return ""; }
}
function updateCounter(){
  const n = seenSet().size;
  const el = document.getElementById("gachaCount");
  if(!el) return;
  el.innerHTML = n >= 36
    ? "🎉 <b>COMPLETE!!</b> 10/24-25 京都で会おう🍟"
    : "みつけた <b>" + n + "</b> / 36 ・ あと" + (36 - n) + "枚" + spotLine() + fesLine();
  const zs = document.getElementById("zuSub");
  if(zs) zs.textContent = n >= 36 ? "36 / 36" : n + " / 36 みつけた";
  const zb = document.getElementById("zuBtnN");
  if(zb) zb.textContent = n >= 36 ? "図鑑" : (n ? "みつけた" + n + "枚" : "図鑑");
}
// シェア文は「何枚みつけたか」を入れる。画像は作らない（借りている作品を外に出さないため）
function shareTextNow(){
  const n = seenSet().size;
  if(n >= 36) return "JUNKeeeeS 36人ぜんぶ集めた🍟 10/24-25はJUNKeeeeS FES in KYOTO！ #CHARAMARL";
  return "JUNKeeeeSを" + n + "/36人みつけた🍟 タップで1枚ずつ引けます。10/24-25はJUNKeeeeS FES in KYOTO！ #CHARAMARL";
}
function prefetchNext(){ if(deck.length){ const im2 = new Image(); im2.src = CARDS[deck[deck.length-1]].img; } }
function drawCard(){
  if(!deck.length){
    // 一巡→FES面を2枚見せてから新しい山札
    if(fesIdx < FES.length){
      const f = FES[fesIdx++];
      apply(f);
      curCardKey = f.key;
      try{ setLikeTarget(f.key); }catch(e){}
      stage.style.filter = "none";
      stage.classList.remove("flip","bang"); void stage.offsetWidth; stage.classList.add("bang");
      return;
    }
    fesIdx = 0; shuffle();
  }
  stage.style.filter = "";
  const card = CARDS[deck.pop()];
  const s = seenSet();
  const isNew = !s.has(card.key);
  if(isNew){
    s.add(card.key); localStorage.setItem(SEEN_KEY, JSON.stringify([...s]));
    if(window.cmEvent){
      cmEvent("card_new",{character:"JUNKeeeeS",card:card.key,found:s.size});
      if(s.size===36) cmEvent("collection_complete",{character:"JUNKeeeeS"});
    }
    // 36枚目を引いた瞬間に COMPLETE の画面を出す（ここがいちばんの見せ場）
    if(s.size===36 && typeof openZukan==="function") setTimeout(openZukan, 700);
  }
  if(window.cmEvent)cmEvent("card_view",{character:"JUNKeeeeS",card:card.key,is_new:isNew});
  apply(card);
  curCardKey = card.key;
  try{ setLikeTarget(card.key); }catch(e){}   // ♥の定義より前に1枚目を引くため
  nameEl.textContent = isNew ? "✨ NEW!" : "";
  if(isNew){ nameEl.classList.remove("show"); void nameEl.offsetWidth; nameEl.classList.add("show"); }
  updateCounter();
  prefetchNext();
}
stage.addEventListener("pointerdown", () => {
  if(!tapped){ tapped = true; hint.classList.add("hide"); tapHere.classList.add("hide"); }
  stage.classList.remove("flip"); void stage.offsetWidth; stage.classList.add("flip");
  setTimeout(drawCard, 120);
});
updateCounter();
prefetchNext();
drawCard();

// ♥ いいね ＝ いま出ているカード1枚への「推し」
// これまではページ全体で1つ（ROKUさんの「FUEL UP」と共通）だったが、
// 押している人は画面に出ているカードに反応しているので、カード単位に変えた。
// 集計IDは junk_j01〜junk_j36。サイトのランキング候補には入らない（junk_*は対象外）。
// ※ 端末ごとの記録なので、端末を変えれば増やせる。厳密な投票ではなく「人気の目安」。
var CM_API="/api/react", LIKE_KEY="colortap_likes";
var likeSet=()=>{try{return new Set(JSON.parse(localStorage.getItem(LIKE_KEY)||"[]"));}catch(e){return new Set();}};
var likeBtn=document.getElementById("likeBtn");
var likeCounts={}, likeLoaded=false, curLikeId=null;
var likeIdOf=key=>"junk_"+key;
function renderLike(){
  if(!curLikeId){ likeBtn.style.visibility="hidden"; return; }
  likeBtn.style.visibility="";
  const liked=likeSet().has(curLikeId);
  likeBtn.classList.toggle("on",liked);
  likeBtn.setAttribute("aria-pressed",String(liked));
  document.getElementById("likeIc").textContent=liked?"♥":"♡";
  // 押した瞬間に likeCounts を先に足しているので、ここで二重に足さない
  document.getElementById("likeCt").textContent = likeCounts[curLikeId]||0;
}
// いま出ているカードに合わせて♥を切り替える（drawCard から呼ぶ）
function setLikeTarget(key){
  curLikeId = key && key.startsWith("j") ? likeIdOf(key) : null;  // FES面には♥を出さない
  renderLike();
}
fetch(CM_API).then(r=>r.ok?r.json():null).then(d=>{
  if(!d||d.error)return;
  Object.keys(d).forEach(k=>{ likeCounts[k]=(d[k]&&d[k].likes)||0; });
  likeLoaded=true; renderLike();
}).catch(()=>{});
likeBtn.addEventListener("pointerdown",e=>e.stopPropagation());
likeBtn.addEventListener("click",()=>{
  if(!curLikeId)return;
  const id=curLikeId, s=likeSet(), had=s.has(id);
  had?s.delete(id):s.add(id);
  try{ localStorage.setItem(LIKE_KEY,JSON.stringify([...s])); }catch(e){}
  likeCounts[id]=Math.max(0,(likeCounts[id]||0)+(had?-1:1));
  renderLike();
  if(window.cmEvent)cmEvent("card_like",{character:"JUNKeeeeS",card:id.replace("junk_",""),op:had?"remove":"add"});
  fetch(CM_API,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id,type:"like",op:had?"remove":"add"})})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d&&typeof d.count==="number"){ likeCounts[id]=d.count; renderLike(); } })
    .catch(()=>{});
});
setLikeTarget(curCardKey);   // 最初の1枚はこのブロックより前に引かれている
// 🚀 シェア
const shareOverlay=document.getElementById("shareOverlay");
const shareBtn=document.getElementById("shareBtn");
shareBtn.addEventListener("pointerdown",e=>e.stopPropagation());
shareBtn.addEventListener("click",()=>{
  document.getElementById("shNative").style.display=navigator.share?"":"none";
  document.getElementById("shCopyLb").textContent="リンクをコピー";
  shareOverlay.classList.add("open");
});
shareOverlay.addEventListener("pointerdown",e=>e.stopPropagation());
shareOverlay.addEventListener("click",e=>{if(e.target===shareOverlay)shareOverlay.classList.remove("open");});
document.querySelectorAll(".share-opt").forEach(btn=>btn.addEventListener("click",()=>{
  const url=location.origin+location.pathname;
  const text=(typeof shareTextNow==="function")?shareTextNow()
             :(CONFIG.shareText||(CONFIG.character+" COLOR TAP | CHARAMARL"));
  if(window.cmEvent)cmEvent("tap_share",{character:CONFIG.character,how:btn.dataset.sh});
  const kind=btn.dataset.sh;
  if(kind==="x")window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(text)+"&url="+encodeURIComponent(url),"_blank");
  else if(kind==="line")window.open("https://social-plugins.line.me/lineit/share?url="+encodeURIComponent(url),"_blank");
  else if(kind==="copy"){
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>{
      document.getElementById("shCopyLb").textContent="✓ コピーしました";
      setTimeout(()=>shareOverlay.classList.remove("open"),700);
    }).catch(()=>{prompt("このURLをコピーしてください",url);});
    return;
  }
  else if(kind==="native"&&navigator.share)navigator.share({title:text,url}).catch(()=>{});
  shareOverlay.classList.remove("open");
}));


/* ===== 遊び終わったあとの行き先（結果画面） =====
   6色ぜんぶをタップした時点で下からパネルを出す。遊びは止めない（そのままタップし続けられる）。
   目的は「遊んで終わり」をなくし、作家さんの作品・SNS・ショップへ送ること。 */
const CM_NEXT = {"artist": "ROKU", "out": "g9769aa4b0d9b", "goods": ""};
(function(){
  const panel=document.getElementById("nextPanel"), btns=document.getElementById("nxBtns");
  if(!panel||!btns||!CM_NEXT||!CM_NEXT.artist) return;
  const SITE="https://charamarl.com", who=CM_NEXT.artist;
  const mk=(href,label,cls,fn)=>{
    const a=document.createElement("a");
    a.className="nx"+(cls?" "+cls:""); a.href=href; a.textContent=label;
    if(/^https?:/.test(href)&&href.indexOf(SITE)!==0){a.target="_blank";a.rel="noopener";}
    a.addEventListener("click",()=>{if(fn)fn();});
    btns.appendChild(a); return a;
  };
  document.getElementById("nxTitle").textContent=who+"さんの絵です";
  mk(SITE+"/artist.html?a="+encodeURIComponent(who), "🎪 "+who+"さんの作品をもっと見る", "",
     ()=>window.cmEvent&&cmEvent("tap_next_click",{destination:"artist_page",artist:who}));
  if(CM_NEXT.out)
    mk(SITE+"/api/out?g="+CM_NEXT.out, "↗ "+who+"さんのSNS・ショップへ", "ghost",
       ()=>window.cmEvent&&cmEvent("tap_next_click",{destination:"artist_link",artist:who}));
  if(CM_NEXT.goods)
    mk(SITE+"/characters/"+CM_NEXT.goods, "🛒 グッズを見る", "ghost",
       ()=>window.cmEvent&&cmEvent("tap_next_click",{destination:"goods",artist:who}));
  mk(SITE+"/", "ほかのキャラクターも見る →", "plain",
     ()=>window.cmEvent&&cmEvent("tap_next_click",{destination:"home",artist:who}));

  panel.addEventListener("pointerdown",e=>e.stopPropagation());
  document.getElementById("nxClose").addEventListener("click",()=>{
    panel.classList.remove("open"); panel.setAttribute("aria-hidden","true");
    document.body.classList.remove("nx-open");
  });
  let shown=false, seen=new Set();
  window.cmTapSeen=function(key){
    if(shown) return;
    seen.add(key);
    // ひと通り遊んだ人にだけ出す。色数が多いページ(ハンナさん14点など)は6回で足切りする
    if(seen.size < 12) return;   // 36枚あるページなので、6枚では早すぎる
    shown=true;
    if(window.cmEvent)cmEvent("tap_complete",{artist:who});
    setTimeout(()=>{
      document.documentElement.style.setProperty("--nx-h", panel.offsetHeight+"px");
      panel.classList.add("open"); panel.setAttribute("aria-hidden","false");
      document.body.classList.add("nx-open");
    },420);
  };
})();

// タップ前だけ、2.5秒後に一度ゆれる。以後は3.2秒ごと。最初のタップで止まる。
// 動きを減らす設定の端末では出さない。
(function(){
  try{ if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return; }catch(e){}
  const shake = () => {
    if(tapped){ stage.classList.remove("nudge"); return false; }
    stage.classList.remove("nudge"); void stage.offsetWidth; stage.classList.add("nudge");
    return true;
  };
  setTimeout(()=>{
    if(!shake()) return;
    const t = setInterval(()=>{ if(!shake()) clearInterval(t); }, 3200);
  }, 2500);
})();

// ===== 図鑑 =====
// カードには名前もプロフィールも焼き込まれている。一度引いて流れたら戻れないのはもったいないので、
// みつけた分だけ並べて見返せるようにする。未発見は「?」のまま（中身は見せない）。
(function(){
  const ov=document.getElementById("zuOverlay"), grid=document.getElementById("zuGrid");
  const big=document.getElementById("zuBig"), bigImg=document.getElementById("zuBigImg");
  const btn=document.getElementById("zuBtn"), close=document.getElementById("zuClose");
  if(!ov||!grid||!btn) return;
  // そろうまでは「みつけた分だけ」を並べる。？を並べると壁のようになって分かりにくい。
  // 36枚そろったら COMPLETE の帯を出して、36枚を一面に並べる。
  function render(){
    const got=seenSet();
    const complete = got.size>=CARDS.length;
    grid.innerHTML="";
    let list = complete ? CARDS.slice() : CARDS.filter(c=>got.has(c.key));
    if(typeof spotDone==="function" && spotDone()) list = list.concat([FES_CARD]);
    document.getElementById("zuDone").hidden = !complete;
    document.getElementById("zuTtl").textContent = complete ? "JUNKeeeeS 図鑑" : "みつけたJUNKeeeeS";
    list.forEach((c)=>{
      const cell=document.createElement("button");
      const isFes = c.key==="fes_only";
      cell.type="button"; cell.className="zu-cell got"+(isFes?" fes":"");
      const idx = CARDS.indexOf(c);
      if(idx>=0){ const no=document.createElement("span"); no.className="n"; no.textContent=idx+1; cell.appendChild(no); }
      if(isFes){ const t=document.createElement("span"); t.className="fesx"; t.textContent="会場限定"; cell.appendChild(t); }
      const im=document.createElement("img"); im.src=c.img; im.loading="lazy"; im.alt="";
      cell.appendChild(im);
      cell.addEventListener("click",()=>{ bigImg.src=c.img; big.classList.add("open"); });
      grid.appendChild(cell);
    });
    if(!list.length){
      const p=document.createElement("div");
      p.style.cssText="grid-column:1/-1;color:#8b89a0;font-size:13px;text-align:center;padding:30px 0;font-weight:700;";
      p.textContent="まだ1枚も引いていません。画面をタップしてカードを引いてください。";
      grid.appendChild(p);
    }
  }
  btn.addEventListener("pointerdown",e=>e.stopPropagation());
  window.openZukan = ()=>{
    render(); updateCounter(); ov.classList.add("open"); document.body.classList.add("zu-open");
    if(window.cmEvent)cmEvent("zukan_open",{character:"JUNKeeeeS",found:seenSet().size});
  };
  btn.addEventListener("click",()=>openZukan());
  ov.addEventListener("pointerdown",e=>e.stopPropagation());
  const shut=()=>{ ov.classList.remove("open"); document.body.classList.remove("zu-open"); };
  close.addEventListener("click",shut);
  ov.addEventListener("click",e=>{ if(e.target===ov) shut(); });
  big.addEventListener("pointerdown",e=>e.stopPropagation());
  big.addEventListener("click",()=>big.classList.remove("open"));
})();

// ===== 会場スタンプ（NFC 3か所） =====
// FES会場に置いたNFCを読むと ?spot=a|b|c でこのページが開く。
// 3つそろうと、図鑑に「会場限定」の1枚が増える。ウォレットもアプリも要らない。
const SPOT_KEY="junk_fes_spots", SPOTS=["a","b","c"];
// 会場限定カード。ROKUさんから絵をもらえたら img を差し替える（いまはFES面を仮に使う）
const FES_CARD={ key:"fes_only", name:"会場限定カード", img:"art/junkeeees_fes1.jpg" };
const spotSet=()=>{try{return new Set(JSON.parse(localStorage.getItem(SPOT_KEY)||"[]"));}catch(e){return new Set();}};
const spotDone=()=>spotSet().size>=SPOTS.length;
function toast(msg){
  const el=document.getElementById("spotToast"); if(!el)return;
  el.textContent=msg; el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"), 3600);
}
(function(){
  let q=""; try{ q=(new URLSearchParams(location.search).get("spot")||"").toLowerCase(); }catch(e){}
  if(!SPOTS.includes(q)) return;
  const s=spotSet(); const isNew=!s.has(q);
  s.add(q); try{ localStorage.setItem(SPOT_KEY, JSON.stringify([...s])); }catch(e){}
  if(window.cmEvent)cmEvent("fes_spot",{spot:q,found:s.size,is_new:isNew});
  if(s.size>=SPOTS.length){
    toast("🎉 会場スタンプ 3/3 コンプリート！図鑑に1枚ふえました");
    if(isNew && window.cmEvent)cmEvent("fes_complete",{});
  }else{
    toast("会場スタンプ "+s.size+" / 3 ・ あと"+(SPOTS.length-s.size)+"か所");
  }
  if(typeof updateCounter==="function") updateCounter();
})();
</script>
