<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COLOR TAP — CHARAMARL</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background: var(--bg, #F2EDE2);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
    transition: background .35s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .stage {
    position:relative; width:min(94vmin,680px); aspect-ratio:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
    transform-origin: 50% 78%;
    /* 揺らぎ(boil)＋静止時は少し暗く＝映え */
    filter:url(#boil) brightness(.94);
    -webkit-transform: translateZ(0);          /* iOSの消失バグ回避 */
  }
  @media (prefers-reduced-motion: reduce){ .stage{ filter:url(#boil); } }
  .stage img {
    width:100%; height:100%; object-fit:contain;
    filter: hue-rotate(var(--hue,0deg)) saturate(var(--sat,1)) brightness(var(--bri,1));
    transition: filter .3s ease;
  }
  /* pop は .stage 自身に。filter+transform を同一要素にしてiOSの消失を防ぐ */
  .stage.pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  .stage.flip { animation: cardflip .32s ease; }
  @keyframes cardflip { 0%{transform:rotateY(0)} 45%{transform:rotateY(90deg)} 55%{transform:rotateY(90deg)} 100%{transform:rotateY(0)} }
  .gacha-count{margin:14px auto 0;text-align:center;font-size:14px;font-weight:800;background:rgba(255,255,255,.12);border-radius:22px;padding:9px 20px;width:fit-content;letter-spacing:.04em;}
  .gacha-count b{color:#FFB74D;font-size:17px;}
  @keyframes pop {
    0%   { transform: translateY(0)    scale(1)    rotate(0deg); filter:url(#boil) brightness(1.12); }  /* タップ瞬間=明るく */
    25%  { transform: translateY(-14%) scale(1.12) rotate(-5deg); }                                     /* ぴょん */
    55%  { transform: translateY(2%)   scale(.96)  rotate(4deg); }
    100% { transform: translateY(0)    scale(1)    rotate(0deg); filter:url(#boil) brightness(.94); }   /* 揺らぎ=少し暗く */
  }

  .ui { position:fixed; inset:0; pointer-events:none; }
  .name {
    position:fixed; top:6%; left:0; right:0; text-align:center;
    font-size:clamp(20px,4.5vmin,32px); font-weight:800;
    letter-spacing:.14em; color:#111;
    text-shadow:3px 3px 0 rgba(255,233,74,.9);
    opacity:0; transform:translateY(8px) scale(.9);
  }
  .name.show { animation: flash 1.1s ease forwards; }
  @keyframes flash {
    0%   { opacity:0; transform:translateY(8px) scale(.9); }
    15%  { opacity:1; transform:translateY(0) scale(1.06); }
    25%  { transform:scale(1); }
    80%  { opacity:1; }
    100% { opacity:0; }
  }
  .bottom { position:fixed; left:0; right:0; bottom:6%; text-align:center; }
  .hint {
    display:inline-block; background:#fff; color:#111; font-weight:900;
    padding:12px 24px; border-radius:30px; font-size:clamp(14px,3.5vmin,18px);
    box-shadow:0 6px 0 rgba(0,0,0,.12); animation:bob 1.4s ease-in-out infinite;
    transition:opacity .4s;
  }
  .hint.hide { opacity:0; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);} }

  .tap-here {
    position:fixed; top:16%; right:8%;
    font-family:'Comic Sans MS','Chalkboard SE',cursive;
    font-weight:900; font-size:clamp(22px,5.5vmin,36px); color:#111;
    line-height:1.1; text-align:center; transform-origin:center;
    animation:tapwiggle 1.6s ease-in-out infinite; transition:opacity .4s;
    filter:drop-shadow(2px 2px 0 rgba(255,233,74,.95));
  }
  .tap-here.hide { opacity:0; }
  @keyframes tapwiggle {
    0%{transform:rotate(-6deg) scale(1);} 25%{transform:rotate(4deg) scale(1.08);}
    50%{transform:rotate(-4deg) scale(1.04);} 75%{transform:rotate(5deg) scale(1.1);}
    100%{transform:rotate(-6deg) scale(1);}
  }
  @media (prefers-reduced-motion: reduce){ .tap-here,.hint{ animation:none; } }

  .buy {
    pointer-events:auto; display:inline-block; margin-top:14px;
    background:#111; color:#fff; font-weight:900; text-decoration:none;
    padding:14px 28px; border-radius:30px; font-size:clamp(14px,3.5vmin,18px);
    box-shadow:0 6px 0 rgba(0,0,0,.25); transition:transform .12s;
  }
  .buy:active { transform:scale(.96); }
  .like {
    pointer-events:auto; display:inline-flex; align-items:center; gap:8px; margin-top:14px;
    background:#fff; border:3px solid #111; color:#e0245e; font-weight:900; font-family:inherit;
    padding:12px 24px; border-radius:30px; font-size:clamp(14px,3.5vmin,18px); cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,.15); transition:transform .12s;
  }
  .like:active { transform:scale(.96); }
  .like.on { background:#e0245e; border-color:#e0245e; color:#fff; }

  .share-btn{
    pointer-events:auto; display:inline-flex; align-items:center; gap:8px; margin-top:14px; margin-left:8px;
    background:#fff; border:3px solid #111; color:#111; font-weight:900; font-family:inherit;
    padding:12px 24px; border-radius:30px; font-size:clamp(14px,3.5vmin,18px); cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,.15); transition:transform .12s;
  }
  .share-btn:active{ transform:scale(.96); }
  .share-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:700;display:none;align-items:flex-end;justify-content:center;}
  .share-overlay.open{display:flex;}
  .share-menu{background:#fff;border-radius:22px 22px 0 0;padding:20px 22px 30px;width:min(480px,100%);font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;}
  @media(min-width:600px){ .share-overlay{align-items:center;} .share-menu{border-radius:22px;} }
  .share-title{font-weight:900;font-size:15px;margin-bottom:14px;text-align:center;color:#111;}
  .share-grid{display:flex;flex-direction:column;gap:6px;}
  .share-opt{display:flex;align-items:center;gap:12px;background:none;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:800;color:#111;padding:10px 8px;border-radius:12px;width:100%;}
  .share-opt:hover{background:#f5f5f5;}
  .share-ic{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;}
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<!-- 手描き風の揺らぎ（boil）フィルター -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="1" result="n">
      <animate attributeName="seed" values="1;2;3;4;5;6;7;8" dur="0.8s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="stage" id="stage">
  <img id="char" src="" alt="">
</div>
<div class="gacha-count" id="gachaCount"></div>

<div class="ui">
  <div class="name" id="name"></div>
  <div class="tap-here" id="tapHere">TAP<br>HERE</div>
  <div class="bottom">
    <div class="hint" id="hint">タップで色がかわるよ!</div><br>
    <button class="like" id="likeBtn" type="button" aria-pressed="false"><span id="likeIc">♡</span>いいね <b id="likeCt"></b></button>
    <button class="share-btn" id="shareBtn" type="button">🚀 シェア</button>
    <a class="buy" id="buy" href="#" target="_blank" rel="noopener">🛒 購入する</a>
  </div>
</div>


<div class="share-overlay" id="shareOverlay">
  <div class="share-menu">
    <div class="share-title">シェアする</div>
    <div class="share-grid">
      <button class="share-opt" data-sh="x"><span class="share-ic" style="background:#111;color:#fff">𝕏</span>X</button>
      <button class="share-opt" data-sh="line"><span class="share-ic" style="background:#06C755;color:#fff">LINE</span>LINE</button>
      <button class="share-opt" data-sh="copy"><span class="share-ic" style="background:#f0f0f0">🔗</span><span id="shCopyLb">リンクをコピー</span></button>
      <button class="share-opt" data-sh="native" id="shNative"><span class="share-ic" style="background:#f0f0f0">📲</span>その他</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   COLOR TAP 統一フォーマット — ここだけ書き換えれば新キャラ完成
   ========================================================= */
const CONFIG = {
  character: "JUNKeeeeS",                     // 表示名
  shareText: "JUNKeeeeSをタップで色チェンジ🍟 10/24-25はJUNKeeeeS FES in KYOTO！ #CHARAMARL",
  baseImage: "art/junkeeees.jpg",                 // 透過キーアートPNG（正方形・1080px推奨）
  bg: "#EAF1F6",                            // 初期背景色
  mode: "char",                             // "char"=キャラの色が変わる / "bg"=背景の色が変わる（黒系キャラ向け）
  baseHueOffset: -220,                      // 青い体毛を基準に補正

  // mode:"image" のとき使う。事前生成PNG = `${imageDir}/${imageKey}_${key}.png`
  imageDir: "art/colors",
  imageKey: "sue",

  // 6色パレット（key=画像/色名キー。hue/sat/bri は char モード用）
  palettes: [
    { key:"j01", name:"", img:"art/junk/j01.jpg" },
    { key:"j02", name:"", img:"art/junk/j02.jpg" },
    { key:"j03", name:"", img:"art/junk/j03.jpg" },
    { key:"j04", name:"", img:"art/junk/j04.jpg" },
    { key:"j05", name:"", img:"art/junk/j05.jpg" },
    { key:"j06", name:"", img:"art/junk/j06.jpg" },
    { key:"j07", name:"", img:"art/junk/j07.jpg" },
    { key:"j08", name:"", img:"art/junk/j08.jpg" },
    { key:"j09", name:"", img:"art/junk/j09.jpg" },
    { key:"j10", name:"", img:"art/junk/j10.jpg" },
    { key:"j11", name:"", img:"art/junk/j11.jpg" },
    { key:"j12", name:"", img:"art/junk/j12.jpg" },
    { key:"j13", name:"", img:"art/junk/j13.jpg" },
    { key:"j14", name:"", img:"art/junk/j14.jpg" },
    { key:"j15", name:"", img:"art/junk/j15.jpg" },
    { key:"j16", name:"", img:"art/junk/j16.jpg" },
    { key:"j17", name:"", img:"art/junk/j17.jpg" },
    { key:"j18", name:"", img:"art/junk/j18.jpg" },
    { key:"j19", name:"", img:"art/junk/j19.jpg" },
    { key:"j20", name:"", img:"art/junk/j20.jpg" },
    { key:"j21", name:"", img:"art/junk/j21.jpg" },
    { key:"j22", name:"", img:"art/junk/j22.jpg" },
    { key:"j23", name:"", img:"art/junk/j23.jpg" },
    { key:"j24", name:"", img:"art/junk/j24.jpg" },
    { key:"j25", name:"", img:"art/junk/j25.jpg" },
    { key:"j26", name:"", img:"art/junk/j26.jpg" },
    { key:"j27", name:"", img:"art/junk/j27.jpg" },
    { key:"j28", name:"", img:"art/junk/j28.jpg" },
    { key:"j29", name:"", img:"art/junk/j29.jpg" },
    { key:"j30", name:"", img:"art/junk/j30.jpg" },
    { key:"j31", name:"", img:"art/junk/j31.jpg" },
    { key:"j32", name:"", img:"art/junk/j32.jpg" },
    { key:"j33", name:"", img:"art/junk/j33.jpg" },
    { key:"j34", name:"", img:"art/junk/j34.jpg" },
    { key:"j35", name:"", img:"art/junk/j35.jpg" },
    { key:"j36", name:"", img:"art/junk/j36.jpg" },
    { key:"fes1", name:"JUNKeeeeS FES 2026 in KYOTO 🎪", img:"art/junkeeees_fes1.jpg" },
    { key:"fes2", name:"EVENT DETAILS 📅 10/24-25", img:"art/junkeeees_fes2.jpg" },
  ],

  // 購入リンク（Shopify or CHARAMARL）。variants 空なら productUrl のみ
  shop: {
    productUrl: "https://thedinorenny.online/products/...",
    variants: {                              // 色名: Shopify variant ID
      "BLAZE RED":"", "SUNNY YELLOW":"", "SLIME GREEN":"",
      "ICE CYAN":"", "GALAXY BLUE":"", "NEON PINK":"",
    }
  }
};
/* ========================================================= */

document.title = CONFIG.character + " COLOR TAP | CHARAMARL";
document.body.style.setProperty("--bg", CONFIG.bg);
document.getElementById("char").src = CONFIG.baseImage;
// 商品未設定なら購入ボタンを隠す
const shopReady = CONFIG.shop.productUrl && !CONFIG.shop.productUrl.includes("...");
// image方式は全色を事前読み込みしてタップ即時切替（遅延防止）
CONFIG.palettes.filter(p=>p.img).forEach(p => { const im = new Image(); im.src = p.img; });
if(CONFIG.mode === "image"){
  CONFIG.palettes.forEach(p => { const im = new Image(); im.src = `${CONFIG.imageDir}/${CONFIG.imageKey}_${p.key}.png`; });
}

const stage = document.getElementById("stage");
const img   = document.getElementById("char");
const nameEl= document.getElementById("name");
const hint  = document.getElementById("hint");
const tapHere = document.getElementById("tapHere");
const buyEl = document.getElementById("buy");

let idx = 0, tapped = false;

function apply(p){
  if(p.img){
    // FESフライヤー面: フィルタを外して画像そのものを表示
    img.style.filter = "none";
    img.src = p.img;
  } else if(CONFIG.mode === "image"){
    // 事前生成の鮮やかPNGを差し替え（最も正確）
    img.style.filter = "none";
    img.src = `${CONFIG.imageDir}/${CONFIG.imageKey}_${p.key}.png`;
  } else if(CONFIG.mode === "bg"){
    // 背景の色が変わる（黒系キャラ向け）
    document.body.style.background = `hsl(${p.hue}, 85%, 62%)`;
  } else {
    // キャラ（帽子・靴などの有彩色）の色が変わる
    img.style.filter = "";
    img.src = CONFIG.baseImage;
    img.style.setProperty("--hue", (p.hue + CONFIG.baseHueOffset) + "deg");
    img.style.setProperty("--sat", p.sat);
    img.style.setProperty("--bri", p.bri);
  }
  nameEl.textContent = p.name;
  nameEl.classList.remove("show"); void nameEl.offsetWidth; nameEl.classList.add("show"); // ぱっと出てフェイドアウト
  if(shopReady){
    const vid = CONFIG.shop.variants[p.name];
    buyEl.href = vid ? CONFIG.shop.productUrl + "?variant=" + vid : CONFIG.shop.productUrl;
    buyEl.textContent = "🛒 " + p.name + " を購入";
  } else {
    buyEl.style.display = "none";
  }
}
// ===== JUNKeeeeS 36ガチャ + 図鑑 =====
const CARDS = CONFIG.palettes.filter(p=>p.key.startsWith("j"));
const FES = CONFIG.palettes.filter(p=>p.key.startsWith("fes"));
const SEEN_KEY = "junk_gacha_seen";
const seenSet = ()=>{try{return new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||"[]"));}catch(e){return new Set();}};
let deck = [], fesIdx = 0, completeMode = false;
function shuffle(){ deck = CARDS.map((c,i)=>i); for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];} }
shuffle();
function updateCounter(){
  const n = seenSet().size;
  const el = document.getElementById("gachaCount");
  if(!el) return;
  el.innerHTML = n >= 36 ? "🎉 <b>COMPLETE!!</b> 36キャラぜんぶ発見！ 10/24-25、京都で会おう🍟" : "みつけたJUNKeeeeS <b>" + n + "</b> / 36";
}
function prefetchNext(){ if(deck.length){ const im2 = new Image(); im2.src = CARDS[deck[deck.length-1]].img; } }
function drawCard(){
  if(!deck.length){
    // 一巡→FES面を2枚見せてから新しい山札
    if(fesIdx < FES.length){ const f = FES[fesIdx++]; apply(f); return; }
    fesIdx = 0; shuffle();
  }
  const card = CARDS[deck.pop()];
  const s = seenSet();
  const isNew = !s.has(card.key);
  if(isNew){ s.add(card.key); localStorage.setItem(SEEN_KEY, JSON.stringify([...s])); }
  apply(card);
  nameEl.textContent = isNew ? "✨ NEW!" : "";
  if(isNew){ nameEl.classList.remove("show"); void nameEl.offsetWidth; nameEl.classList.add("show"); }
  updateCounter();
  prefetchNext();
}
stage.addEventListener("pointerdown", () => {
  if(!tapped){ tapped = true; hint.classList.add("hide"); tapHere.classList.add("hide"); }
  stage.classList.remove("flip"); void stage.offsetWidth; stage.classList.add("flip");
  setTimeout(drawCard, 120);
});
updateCounter();
prefetchNext();
drawCard();

// ♥ いいね（CHARAMARLのカゲチヨ作品と共通集計）
const CM_API="/api/react", LIKE_ID="g9769aa4b0d9b", LIKE_BASE=0;
const LIKE_KEY="colortap_likes";
const likeSet=()=>{try{return new Set(JSON.parse(localStorage.getItem(LIKE_KEY)||"[]"));}catch(e){return new Set();}};
let likeServer=0, likeKnown=false;
const likeBtn=document.getElementById("likeBtn");
function renderLike(){
  const liked=likeSet().has(LIKE_ID);
  likeBtn.classList.toggle("on",liked);
  likeBtn.setAttribute("aria-pressed",String(liked));
  document.getElementById("likeIc").textContent=liked?"♥":"♡";
  document.getElementById("likeCt").textContent=LIKE_BASE+likeServer+((!likeKnown&&liked)?1:0);
}
fetch(CM_API+"?id="+LIKE_ID).then(r=>r.ok?r.json():null).then(d=>{
  if(d&&typeof d.likes==="number"){likeServer=d.likes;likeKnown=true;renderLike();}
}).catch(()=>{});
likeBtn.addEventListener("pointerdown",e=>e.stopPropagation());
likeBtn.addEventListener("click",()=>{
  const s=likeSet();const had=s.has(LIKE_ID);
  had?s.delete(LIKE_ID):s.add(LIKE_ID);
  localStorage.setItem(LIKE_KEY,JSON.stringify([...s]));
  fetch(CM_API,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id:LIKE_ID,type:"like",op:had?"remove":"add"})})
    .then(r=>r.ok?r.json():null)
    .then(d=>{if(d&&typeof d.count==="number"){likeServer=d.count;likeKnown=true;renderLike();}})
    .catch(()=>{});
  renderLike();
});
renderLike();
// 🚀 シェア
const shareOverlay=document.getElementById("shareOverlay");
const shareBtn=document.getElementById("shareBtn");
shareBtn.addEventListener("pointerdown",e=>e.stopPropagation());
shareBtn.addEventListener("click",()=>{
  document.getElementById("shNative").style.display=navigator.share?"":"none";
  document.getElementById("shCopyLb").textContent="リンクをコピー";
  shareOverlay.classList.add("open");
});
shareOverlay.addEventListener("pointerdown",e=>e.stopPropagation());
shareOverlay.addEventListener("click",e=>{if(e.target===shareOverlay)shareOverlay.classList.remove("open");});
document.querySelectorAll(".share-opt").forEach(btn=>btn.addEventListener("click",()=>{
  const url=location.origin+location.pathname;
  const text=CONFIG.shareText||(CONFIG.character+" COLOR TAP | CHARAMARL");
  const kind=btn.dataset.sh;
  if(kind==="x")window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(text)+"&url="+encodeURIComponent(url),"_blank");
  else if(kind==="line")window.open("https://social-plugins.line.me/lineit/share?url="+encodeURIComponent(url),"_blank");
  else if(kind==="copy"){
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>{
      document.getElementById("shCopyLb").textContent="✓ コピーしました";
      setTimeout(()=>shareOverlay.classList.remove("open"),700);
    }).catch(()=>{prompt("このURLをコピーしてください",url);});
    return;
  }
  else if(kind==="native"&&navigator.share)navigator.share({title:text,url}).catch(()=>{});
  shareOverlay.classList.remove("open");
}));

</script>

</body>
</html>
